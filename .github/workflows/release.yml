name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 创建 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 确定构建工具版本
        id: ver
        run: |
          echo "version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :app:assembleRelease --no-daemon

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 整理产物
        run: |
          mkdir -p out
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "out/xiaoai-${V}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk   "out/xiaoai-${V}-debug.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## XiaoAi Hijack ${{ github.ref_name }}

            小米运动健康 AI 助手接管模块（LSPosed）。把「小爱同学」的回答替换为任意 OpenAI 兼容大模型。

            ### 下载
            - `xiaoai-*-release.apk` — 日常使用
            - `xiaoai-*-debug.apk` — 排查问题用

            ### 安装
            1. 安装 APK
            2. LSPosed 中启用模块，作用域勾选 **小米运动健康**
            3. **强制停止**小米运动健康
            4. 打开 App →「我的」→「AI 助手设置」

            > 需要 Android 7.0+ 与 LSPosed / EdXposed。
