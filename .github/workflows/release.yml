name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: 配置 Android SDK
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sSL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q clt.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          sudo chmod -R 755 $ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 基础组件（这些一定存在）
          sdkmanager "platform-tools" "build-tools;36.0.0" 2>&1 | tail -3
          # Android 37 是「次版本」SDK，包名可能带 .0 也可能不带，两种都试。
          # 拿不到就退到 android-36 —— AGP 允许 compileSdk 高于已装 SDK 时自动降级。
          sdkmanager "platforms;android-37.0" 2>&1 | tail -3 \
            || sdkmanager "platforms;android-37" 2>&1 | tail -3 \
            || sdkmanager "platforms;android-36" 2>&1 | tail -3 \
            || true
          echo "===== 已安装 platform ====="
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "===== 已安装 build-tools ====="
          ls -1 "$ANDROID_HOME/build-tools" || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 缓存 Gradle 安装包
        id: gradle_cache
        uses: actions/cache@v4
        with:
          path: /opt/gradle-9.3.1
          key: gradle-9.3.1-bin

      - name: 安装 Gradle 9.3.1（AGP 9.1.0 要求）
        if: steps.gradle_cache.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
          # 解压前先清掉可能存在的旧目录（unzip 出来的就是 /opt/gradle-9.3.1）
          sudo rm -rf /opt/gradle-9.3.1
          sudo mkdir -p /opt
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo chmod -R 755 /opt/gradle-9.3.1
          /opt/gradle-9.3.1/bin/gradle --version | head -5

      - name: 校验 Gradle 可用（缓存可能不完整）
        run: |
          if [ ! -x /opt/gradle-9.3.1/bin/gradle ]; then
            echo "缓存里的 Gradle 不可用，重新下载安装…"
            sudo curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
            sudo rm -rf /opt/gradle-9.3.1
            sudo mkdir -p /opt
            sudo unzip -q -o /tmp/gradle.zip -d /opt
            sudo chmod -R 755 /opt/gradle-9.3.1
          fi
          /opt/gradle-9.3.1/bin/gradle --version | head -5

      - name: 创建 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 确定版本号
        id: ver
        run: |
          echo "version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: |
          set -o pipefail
          chmod +x gradlew 2>/dev/null || true
          /opt/gradle-9.3.1/bin/gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tail -120

      - name: 构建 Debug APK
        run: |
          set -o pipefail
          /opt/gradle-9.3.1/bin/gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: 整理产物
        run: |
          mkdir -p out
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "out/xiaomi-health-xiaoai-${V}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk   "out/xiaomi-health-xiaoai-${V}-debug.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          TAG="${GITHUB_REF#refs/tags/}"
          # 用 gh CLI 上传：softprops/action-gh-release@v2 在某些环境下会失败，
          # 走 gh release upload 更稳。注意 -R 指定仓库。
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，追加资产"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --title "小米运动健康·手环小爱增强 $TAG" \
              --generate-notes \
              out/*
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
