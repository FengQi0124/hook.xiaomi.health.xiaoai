name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: 配置 Android SDK
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sSL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q clt.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          # 切到 runner 用户可写（不要 sudo chmod 755，那会让 runner 无法写入）
          sudo chown -R $(id -u):$(id -g) $ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 基础组件（这些一定存在）
          sdkmanager "platform-tools" "build-tools;36.0.0" 2>&1 | tail -3
          # 项目 compileSdk = 35。若无 35 则退到 34。
          sdkmanager "platforms;android-35" 2>&1 | tail -3 \
            || sdkmanager "platforms;android-34" 2>&1 | tail -3 \
            || true
          echo "===== 已安装 platform ====="
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "===== 已安装 build-tools ====="
          ls -1 "$ANDROID_HOME/build-tools" || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 配置原生工具链（NDK + CMake + Ninja）
        run: |
          set -e
          set -x  # 输出每条命令，便于 CI 日志调试
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # ── NDK ──────────────────────────────────────────────────────────
          # sdkmanager 需要 Java；actions/setup-java 已设置 JAVA_HOME，
          # 但 sudo 可能把它吞掉，显式传递。
          # 先试 sdkmanager，失败再走 Google 官方 zip 直链。
          echo "── 安装 NDK 27.0.12077973 ──"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          if ! sdkmanager "ndk;27.0.12077973" 2>&1 | tail -10; then
            echo "⚠ sdkmanager NDK 失败，改下载官方 zip..."
            # NDK 27.0.12077973 = android-ndk-r27c
            curl -sSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
            mkdir -p "$ANDROID_HOME/ndk"
            unzip -q -o /tmp/ndk.zip -d "$ANDROID_HOME/ndk"
            mv "$ANDROID_HOME/ndk"/android-ndk-* "$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "── NDK 目录 ──"
          ls -1 "$ANDROID_HOME/ndk/" || true

          # ── CMake ──────────────────────────────────────────────────────────
          # GitHub Actions runners 有时访问 GitHub releases 不稳定，
          # 优先用 apt 装 cmake（版本够用），否则下载官方二进制。
          echo "── 安装 CMake ──"
          if ! sudo apt-get update -qq 2>/dev/null; then
            echo "⚠ apt-get update 失败，改用直链 CMake"
          fi
          if cmake --version 2>/dev/null | grep -q "3\.2[2-9]"; then
            echo "✅ CMake 已满足要求"
          elif sudo apt-get install -y -qq cmake 2>/dev/null && cmake --version 2>/dev/null | grep -q "3\.2[2-9]"; then
            echo "✅ 通过 apt 安装 CMake"
          else
            echo "⚠ apt CMake 版本不对，下载官方 3.28.3..."
            curl -sSL -o /tmp/cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz" \
              || curl -sSL -o /tmp/cmake.tar.gz "https://mirrors.aliyun.com/cmake/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz"
            tar -xzf /tmp/cmake.tar.gz -C /tmp
            echo "/tmp/cmake-3.28.3-linux-x86_64/bin" >> "$GITHUB_PATH"
          fi
          cmake --version | head -1

          # ── Ninja ───────────────────────────────────────────────────────────
          echo "── 安装 Ninja ──"
          if ! ninja --version 2>/dev/null; then
            if ! sudo apt-get install -y -qq ninja-build 2>/dev/null; then
              curl -sSL -o /tmp/ninja.zip "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip"
              unzip -o /tmp/ninja.zip -d /tmp/ninja-bin
              echo "/tmp/ninja-bin" >> "$GITHUB_PATH"
            fi
          fi
          ninja --version

      - name: 缓存 Gradle 安装包
        id: gradle_cache
        uses: actions/cache@v4
        with:
          path: /opt/gradle-9.3.1
          key: gradle-9.3.1-bin

      - name: 安装 Gradle 9.3.1（AGP 9.1.0 要求）
        if: steps.gradle_cache.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
          # 解压前先清掉可能存在的旧目录（unzip 出来的就是 /opt/gradle-9.3.1）
          sudo rm -rf /opt/gradle-9.3.1
          sudo mkdir -p /opt
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo chmod -R 755 /opt/gradle-9.3.1
          /opt/gradle-9.3.1/bin/gradle --version | head -5

      - name: 校验 Gradle 可用（缓存可能不完整）
        run: |
          if [ ! -x /opt/gradle-9.3.1/bin/gradle ]; then
            echo "缓存里的 Gradle 不可用，重新下载安装…"
            sudo curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
            sudo rm -rf /opt/gradle-9.3.1
            sudo mkdir -p /opt
            sudo unzip -q -o /tmp/gradle.zip -d /opt
            sudo chmod -R 755 /opt/gradle-9.3.1
          fi
          /opt/gradle-9.3.1/bin/gradle --version | head -5

      - name: 创建 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 版本号以 git tag 为准 ────────────────────────────────────────
      # 之前这里是从 build.gradle.kts 里 grep versionName，结果打 beta2 的 tag
      # 却产出叫 beta1 的 APK 文件（build.gradle 忘了同步改）。
      # 打成 tag 的构建，版本号必须由 tag 决定，两者不可能再不一致。
      - name: 确定版本号
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            V="${V#v}"                       # 去掉前缀 v，文件名里不需要
            echo "来源: git tag -> $V"
          else
            V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
            echo "来源: build.gradle.kts -> $V"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: |
          set -o pipefail
          chmod +x gradlew 2>/dev/null || true
          /opt/gradle-9.3.1/bin/gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log | tail -120
          echo ""
          echo "──── 最后 60 行完整构建日志 ────"
          tail -60 /tmp/build.log

      - name: 构建 Debug APK
        run: |
          set -o pipefail
          /opt/gradle-9.3.1/bin/gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      # ── 关键的「打包自检」──────────────────────────────────────────────
      # 历史上踩过的坑：模块用 legacy API(82) + 元数据放在 assets/ 下，
      # 结果 LSPosed 1.10+ 完全忽略这个模块 —— App 里没入口、日志里没输出，
      # 但构建是「成功」的，直到用户装上才发现。
      # 所以这里在发布前强制校验 APK 的现代 API 契约，不合格直接让 CI 失败。
      - name: 校验 libxposed 现代 API 打包契约
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          echo "── 1. META-INF/xposed/ 三项必须在 APK 根目录（不是 assets/ 下）──"
          unzip -l "$APK" | grep -q "META-INF/xposed/module.prop"    || { echo "✗ 缺 META-INF/xposed/module.prop"; exit 1; }
          unzip -l "$APK" | grep -q "META-INF/xposed/java_init.list" || { echo "✗ 缺 META-INF/xposed/java_init.list"; exit 1; }
          unzip -l "$APK" | grep -q "META-INF/xposed/scope.list"     || { echo "✗ 缺 META-INF/xposed/scope.list"; exit 1; }

          echo "── 2. 绝不能残留 legacy 的 assets/xposed_init ──"
          if unzip -l "$APK" | grep -q "assets/xposed_init"; then
            echo "✗ 仍存在 legacy assets/xposed_init"; exit 1
          fi

          echo "── 3. module.prop 必须有 minApiVersion / targetApiVersion ──"
          unzip -p "$APK" META-INF/xposed/module.prop > /tmp/mp.txt
          grep -qE '^minApiVersion=[0-9]+'    /tmp/mp.txt || { echo "✗ module.prop 缺 minApiVersion"; exit 1; }
          grep -qE '^targetApiVersion=[0-9]+' /tmp/mp.txt || { echo "✗ module.prop 缺 targetApiVersion"; exit 1; }
          cat /tmp/mp.txt

          echo "── 4. 入口类必须在 DEX 里且继承 io.github.libxposed.api.XposedModule ──"
          ENTRY=$(unzip -p "$APK" META-INF/xposed/java_init.list | head -1)
          ENTRY_PATH=$(echo "$ENTRY" | tr '.' '/')
          echo "入口类: $ENTRY"
          rm -rf /tmp/dexchk && mkdir -p /tmp/dexchk
          (cd /tmp/dexchk && unzip -q -o "$GITHUB_WORKSPACE/$APK" 'classes*.dex')
          if ! grep -rq "$ENTRY_PATH" /tmp/dexchk/; then
            echo "✗ DEX 里找不到入口类 $ENTRY"; exit 1
          fi
          if ! grep -rq "io/github/libxposed/api/XposedModule" /tmp/dexchk/; then
            echo "✗ DEX 里没有 libxposed XposedModule —— 入口类可能没继承现代 API"; exit 1
          fi

          echo "✅ 现代 API 打包契约校验通过"

      - name: 整理产物
        run: |
          mkdir -p out
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "out/xiaomi-health-xiaoai-${V}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk   "out/xiaomi-health-xiaoai-${V}-debug.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          TAG="${GITHUB_REF#refs/tags/}"
          # 用 gh CLI 上传：softprops/action-gh-release@v2 在某些环境下会失败，
          # 走 gh release upload 更稳。注意 -R 指定仓库。
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，追加资产"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --title "手环小爱 AI 增强 $TAG" \
              --generate-notes \
              out/*
          fi

          # ── 清理历史遗留的错误命名资产 ──────────────────────────────
          # 曾经出现过「tag 是 beta2、APK 文件名却是 beta1」的问题，
          # --clobber 只覆盖同名文件，所以那些旧名字的资产会一直留着，
          # 用户很容易下错。这里把不属于当前版本 V 的同名系列资产全部删掉。
          echo "── 清理非当前版本($V)的 apk 资产 ──"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
          | grep -E '^xiaomi-health-xiaoai-.*\.apk$' \
          | grep -v -- "-${V}-" \
          | while read -r stale; do
              echo "  删除历史资产: $stale"
              gh release delete-asset "$TAG" "$stale" -R "$GITHUB_REPOSITORY" --yes
            done || true

          echo "── 最终资产清单 ──"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
