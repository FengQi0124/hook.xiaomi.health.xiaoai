name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: 配置 Android SDK
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sSL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q clt.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          sudo chmod -R 755 $ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" 2>&1 | tail -5
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 创建 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 确定版本号
        id: ver
        run: |
          echo "version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :app:assembleRelease --no-daemon

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 整理产物
        run: |
          mkdir -p out
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "out/xiaoai-${V}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk   "out/xiaoai-${V}-debug.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## XiaoAi Hijack ${{ github.ref_name }}

            小米运动健康 AI 助手接管模块（LSPosed）。把「小爱同学」的回答替换为任意 OpenAI 兼容大模型。

            ### v1.1.0 重要变更

            - ✅ **3.57.0 兼容**：3.57.0 上 `Template.Toast` 是 App→Cloud，已自动改为按 `EventHeader` 类型筛选，只劫持真正的 Cloud→App 消息。
            - ✅ **3.59.1 兼容**：沿用 Template.* 四个回答类型。
            - ✅ 默认系统提示词含 `<modelname>` 占位，模型从一开始就知道自己是谁。
            - ✅ 设置页改为顶栏 IconButton 关闭，避免被滚动条推出视口。
            - 如果旧版没生效，**先到 LSPosed 强制停止一次小米运动健康** 再说一句话。

            ### 下载
            - `xiaoai-*-release.apk` — 日常使用
            - `xiaoai-*-debug.apk` — 排查问题用

            ### 安装
            1. 安装 APK
            2. LSPosed 中启用模块，作用域勾选 **小米运动健康**
            3. **强制停止**小米运动健康
            4. 打开 App →「我的」→「AI 助手设置」

            > 需要 Android 7.0+ 与 LSPosed / EdXposed。
