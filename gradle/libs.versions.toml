[versions]
# --- 构建工具链 ---
agp = "9.1.0"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# --- UI ---
lifecycle = "2.8.7"
activityVersion = "1.9.3"
coreKtx = "1.13.1"

# --- 网络 / 序列化 / 协程 ---
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"

# --- 存储 ---
datastore = "1.1.1"

# --- Xposed ---
# libxposed 现代 API。LSPosed 从 1.9.0 起不再加载 legacy（de.robv.android.xposed）模块，
# 必须使用 io.github.libxposed:api。102 对应 LSPosed >= 1.10（模块列表显示 "API 102"）。
xposedApi = "102.0.0"

[libraries]
# AndroidX
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity = { module = "androidx.activity:activity", version.ref = "activityVersion" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityVersion" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# 网络与序列化
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Xposed（现代 API，来自 Maven Central）
xposed-api = { module = "io.github.libxposed:api", version.ref = "xposedApi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
