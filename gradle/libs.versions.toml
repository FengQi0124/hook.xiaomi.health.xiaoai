[versions]
# --- 构建工具链 ---
agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.20-2.0.4"

# --- UI ---
miuix = "0.9.4-rc01"          # Miuix (Compose Multiplatform)，compose-miuix-ui/miuix
composeBom = "2026.09.00"      # androidx compose BOM（用于 android 侧补充组件）
lifecycle = "2.9.4"
activityCompose = "1.12.4"
coreKtx = "1.17.0"

# --- 网络 / 序列化 / 协程 ---
okhttp = "4.12.0"
serialization = "1.9.0"
coroutines = "1.10.2"

# --- 存储 ---
datastore = "1.1.7"

# --- Xposed ---
# libxposed 现代 API。LSPosed 从 1.9.0 起不再加载 legacy（de.robv.android.xposed）模块，
# 必须使用 io.github.libxposed:api。102 对应 LSPosed >= 1.10（模块列表显示 "API 102"）。
xposedApi = "102.0.0"

[libraries]
# Miuix
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }

# AndroidX
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# 网络与序列化
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Xposed（现代 API，来自 Maven Central）
xposed-api = { module = "io.github.libxposed:api", version.ref = "xposedApi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
